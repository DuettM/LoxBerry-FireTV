name: Patch FireTV Sleep Repeat

on:
  push:
    paths:
      - '.sleep-repeat-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Sleep 2x support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Backend: add selectable Sleep 2x sequence using the same delay as TV ON.
          p=Path('bin/firetv.py')
          s=p.read_text(encoding='utf-8')
          old='''    def tv_off(self):\n        method=str(self.device.get("cec_off_method","sleep") or "sleep").lower()\n        if method not in ("sleep","power"):method="sleep"\n        return {"ok":True,"action":"tvoff","method":method,"steps":self._cec_sequence("TV AUS/"+method,[(method,0)])}\n'''
          new='''    def tv_off(self):\n        method=str(self.device.get("cec_off_method","sleep") or "sleep").lower()\n        try:delay=float(self.device.get("cec_on_delay",0.8))\n        except Exception:delay=.8\n        delay=min(max(delay,.1),5.0)\n        methods={"sleep":[("sleep",0)],"sleep_repeat":[("sleep",0),("sleep",delay)],"power":[("power",0)]}\n        if method not in methods:method="sleep"\n        steps=self._cec_sequence("TV AUS/"+method,methods[method])\n        return {"ok":True,"action":"tvoff","method":method,"delay":delay,"steps":steps}\n'''
          if old not in s: raise SystemExit('tv_off block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # UI/config: allow Sleep 2x and preserve same delay setting.
          p=Path('webfrontend/htmlauth/config.cgi')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if offm not in ('sleep','power'):raise ValueError('Ungültige TV-AUS-Methode.')", "if offm not in ('sleep','sleep_repeat','power'):raise ValueError('Ungültige TV-AUS-Methode.')",1)
          s=s.replace("[('sleep','Sleep / Standby'),('power','Power-Taste')]", "[('sleep','Sleep / Standby 1×'),('sleep_repeat','Sleep / Standby 2×'),('power','Power-Taste')]",1)
          s=s.replace('Die Verzögerung wird zwischen Wakeup/Power und Home bzw. zwischen zwei Home-Befehlen verwendet.', 'Die Verzögerung wird zwischen Wakeup/Power und Home sowie zwischen zwei Home- oder zwei Sleep/Standby-Befehlen verwendet.',1)
          p.write_text(s,encoding='utf-8')

          # Changelog: keep this in the still-unreleased 0.3.12 release.
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='## [0.3.12]\n'
          bullet='- TV AUS erweitert: wählbar zwischen Sleep/Standby 1×, Sleep/Standby 2× und Power-Taste; Sleep 2× nutzt die einstellbare Wiederhol-Verzögerung\n'
          if bullet not in s:
              if marker not in s: raise SystemExit('0.3.12 changelog section not found')
              s=s.replace(marker,marker+'\n### Geändert\n'+bullet,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile bin/firetv.py webfrontend/htmlauth/config.cgi
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/firetv.py webfrontend/htmlauth/config.cgi CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add configurable FireTV Sleep 2x power off'
          git push
