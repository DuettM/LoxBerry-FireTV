name: Package FireTV Release
on:
  workflow_dispatch:
  push:
    paths:
      - '.package-trigger-firetv-020'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sources
        run: |
          python3 -m py_compile bin/firetv.py bin/mqtt_listener.py bin/watchdog.py bin/secure_update.py
          bash -n postinstall.sh postupgrade.sh preupgrade.sh daemon/daemon cron/cron.01min uninstall/uninstall.sh
      - name: Build deterministic ZIP
        run: |
          python3 - <<'PY'
          import os,stat,zipfile
          out='LoxBerry-FireTV-0.2.0.zip'
          roots=['bin','config','cron','daemon','uninstall','webfrontend']
          singles=['plugin.cfg','postinstall.sh','postupgrade.sh','preupgrade.sh','release.cfg','prerelease.cfg','README.md','CHANGELOG.md','LICENSE','LEGAL.md','SECURITY.md']
          files=[]
          for root in roots:
              for dp,_,names in os.walk(root):
                  for n in names: files.append(os.path.join(dp,n))
          files += [p for p in singles if os.path.isfile(p)]
          files=sorted(set(files))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  data=open(p,'rb').read(); zi=zipfile.ZipInfo(p.replace(os.sep,'/'),(2026,1,1,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED
                  mode=0o755 if os.stat(p).st_mode & stat.S_IXUSR else 0o644; zi.external_attr=(mode & 0xffff)<<16; zi.create_system=3
                  z.writestr(zi,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          sha256sum LoxBerry-FireTV-0.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-0.2.0-package
          path: LoxBerry-FireTV-0.2.0.zip
          if-no-files-found: error
          retention-days: 7
