name: Tests

# Läuft bei jedem Push und Pull Request. Fängt Fehler ab, bevor ein Release
# gebaut wird - etwa wenn eine Seite die Navigation verliert oder ein Wert
# zwar im Auswahlfeld steht, sich aber nicht speichern lässt.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxprüfung
        run: |
          fail=0
          for f in $(find . -path ./.git -prune -o \( -name '*.py' -o -name '*.cgi' \) -print); do
            head -1 "$f" | grep -q perl && continue
            python3 -m py_compile "$f" || { echo "::error file=$f::Python-Syntaxfehler"; fail=1; }
          done
          for f in $(find . -path ./.git -prune -o -name '*.sh' -print) daemon/daemon cron/cron.01min; do
            bash -n "$f" || { echo "::error file=$f::Bash-Syntaxfehler"; fail=1; }
          done
          exit $fail

      - name: Tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tail -40
