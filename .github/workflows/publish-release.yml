name: Publish FireTV Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.publish-trigger-firetv-current'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F= '/^VERSION=/{print $2; exit}' plugin.cfg)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate sources
        run: |
          python3 -m py_compile bin/firetv.py bin/mqtt_listener.py bin/watchdog.py bin/secure_update.py webfrontend/htmlauth/dashboard.cgi webfrontend/htmlauth/config.cgi webfrontend/htmlauth/discover.cgi webfrontend/htmlauth/security.cgi webfrontend/htmlauth/api.cgi webfrontend/htmlauth/debug.cgi
          bash -n postinstall.sh postupgrade.sh preupgrade.sh daemon/daemon cron/cron.01min uninstall/uninstall.sh
          python3 -m json.tool config/config.default.json >/dev/null
          test -f dpkg/apt
          grep -qx 'adb' dpkg/apt
          test -s icons/icon.svg
          grep -q '^#!/usr/bin/perl' webfrontend/htmlauth/index.cgi
          grep -q 'use LoxBerry::System' webfrontend/htmlauth/index.cgi
          grep -q 'use LoxBerry::Web' webfrontend/htmlauth/index.cgi
          grep -q 'LoxBerry::Web::lbheader' webfrontend/htmlauth/index.cgi
          grep -q 'LoxBerry::Web::lbfooter' webfrontend/htmlauth/index.cgi
          grep -q "frame-ancestors 'self'" webfrontend/htmlauth/config.cgi
          grep -q 'X-Frame-Options: SAMEORIGIN' webfrontend/htmlauth/debug.cgi

      - name: Reject duplicate release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi

      - name: Build deterministic release ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os,stat,zipfile
          version=os.environ['VERSION']
          out=f'LoxBerry-FireTV-{version}.zip'
          roots=['bin','config','cron','daemon','dpkg','icons','uninstall','webfrontend']
          singles=['plugin.cfg','postinstall.sh','postupgrade.sh','preupgrade.sh','release.cfg','prerelease.cfg','README.md','CHANGELOG.md','LICENSE','LEGAL.md','SECURITY.md','THIRD_PARTY_NOTICES.md','SIGNING.md']
          files=[]
          for root in roots:
              if not os.path.isdir(root): continue
              for dp,dirs,names in os.walk(root):
                  dirs[:] = [d for d in dirs if d != '__pycache__']
                  for name in names:
                      if name.endswith(('.pyc','.pyo')): continue
                      files.append(os.path.join(dp,name))
          files += [p for p in singles if os.path.isfile(p)]
          files=sorted(set(files))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in files:
                  data=open(path,'rb').read()
                  info=zipfile.ZipInfo(path.replace(os.sep,'/'),(2026,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  mode=0o755 if os.stat(path).st_mode & stat.S_IXUSR else 0o644
                  info.external_attr=(mode & 0xffff)<<16
                  info.create_system=3
                  z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          sha256sum "LoxBerry-FireTV-${VERSION}.zip" > "LoxBerry-FireTV-${VERSION}.zip.sha256"

      - name: Sign release ZIP with Ed25519 secret
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FIRETV_ED25519_PRIVATE_KEY: ${{ secrets.FIRETV_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$FIRETV_ED25519_PRIVATE_KEY" || { echo 'Missing repository secret FIRETV_ED25519_PRIVATE_KEY'; exit 1; }
          umask 077
          printf '%s\n' "$FIRETV_ED25519_PRIVATE_KEY" > private.pem
          openssl pkey -in private.pem -noout >/dev/null
          ACTUAL_PUB="$(openssl pkey -in private.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          EXPECTED_PUB="$(python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('secure_update','bin/secure_update.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.PUB)
          PY
          )"
          test "$ACTUAL_PUB" = "$EXPECTED_PUB" || { echo 'Signing key does not match embedded public key'; exit 1; }
          openssl pkeyutl -sign -rawin -inkey private.pem -in "LoxBerry-FireTV-${VERSION}.zip" -out release.sig.bin
          base64 -w0 release.sig.bin > "LoxBerry-FireTV-${VERSION}.zip.sig"
          printf '\n' >> "LoxBerry-FireTV-${VERSION}.zip.sig"
          rm -f private.pem release.sig.bin

      - name: Verify generated signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import base64,importlib.util,os
          version=os.environ['VERSION']
          spec=importlib.util.spec_from_file_location('secure_update','bin/secure_update.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          blob=open(f'LoxBerry-FireTV-{version}.zip','rb').read()
          sig=base64.b64decode(open(f'LoxBerry-FireTV-{version}.zip.sig').read().strip(),validate=True)
          if not module.verify(sig,blob,bytes.fromhex(module.PUB)):
              raise SystemExit('Ed25519 verification failed')
          print('Ed25519 signature valid')
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          version=os.environ['VERSION']
          text=open('CHANGELOG.md',encoding='utf-8').read().splitlines()
          start=None;out=[]
          for i,line in enumerate(text):
              if line.strip()==f'## {version}': start=i
              elif start is not None and i>start and line.startswith('## '): break
              if start is not None: out.append(line)
          if not out:
              raise SystemExit(f'No CHANGELOG section found for {version}')
          open('release-notes.md','w',encoding='utf-8').write('\n'.join(out).strip()+'\n')
          PY
          gh release create "v${VERSION}" \
            "LoxBerry-FireTV-${VERSION}.zip" \
            "LoxBerry-FireTV-${VERSION}.zip.sha256" \
            "LoxBerry-FireTV-${VERSION}.zip.sig" \
            --title "Fire TV Control v${VERSION}" \
            --notes-file release-notes.md

      - name: Update LoxBerry release manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release.cfg <<EOF
          [RELEASE]
          VERSION=${VERSION}
          ARCHIVEURL=https://github.com/DuettM/LoxBerry-FireTV/releases/download/v${VERSION}/LoxBerry-FireTV-${VERSION}.zip
          SHA256URL=https://github.com/DuettM/LoxBerry-FireTV/releases/download/v${VERSION}/LoxBerry-FireTV-${VERSION}.zip.sha256
          SIGURL=https://github.com/DuettM/LoxBerry-FireTV/releases/download/v${VERSION}/LoxBerry-FireTV-${VERSION}.zip.sig
          INFOURL=https://raw.githubusercontent.com/DuettM/LoxBerry-FireTV/main/CHANGELOG.md
          EOF
          cp release.cfg prerelease.cfg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.cfg prerelease.cfg
          if git diff --cached --quiet; then
            echo 'Release manifests already current'
          else
            git commit -m "Point FireTV updater to v${VERSION}"
            git push
          fi

      - name: Upload signed release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: firetv-${{ steps.version.outputs.version }}-signed-release
          path: |
            LoxBerry-FireTV-${{ steps.version.outputs.version }}.zip
            LoxBerry-FireTV-${{ steps.version.outputs.version }}.zip.sha256
            LoxBerry-FireTV-${{ steps.version.outputs.version }}.zip.sig
          if-no-files-found: error
          retention-days: 14
