name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile bin/firetv.py bin/mqtt_listener.py bin/watchdog.py webfrontend/htmlauth/dashboard.cgi webfrontend/htmlauth/config.cgi webfrontend/htmlauth/discover.cgi webfrontend/htmlauth/security.cgi webfrontend/htmlauth/api.cgi webfrontend/htmlauth/debug.cgi
      - name: Shell syntax
        run: |
          bash -n postinstall.sh preupgrade.sh postupgrade.sh daemon/daemon cron/cron.01min uninstall/uninstall.sh
      - name: JSON config
        run: python3 -m json.tool config/config.default.json >/dev/null
      - name: Plugin baseline
        run: |
          grep -Eq '^VERSION=[0-9]+\.[0-9]+\.[0-9]+$' plugin.cfg
          grep -q '^AUTOMATIC_UPDATES=true$' plugin.cfg
          grep -q 'web_secret' config/config.default.json
          grep -q 'hmac.compare_digest' webfrontend/htmlauth/config.cgi
          grep -q 'runuser -u loxberry' daemon/daemon
          test -f dpkg/apt
          grep -qx 'adb' dpkg/apt
          test -f webfrontend/htmlauth/dashboard.cgi
          grep -q 'LoxBerry::Web::lbheader' webfrontend/htmlauth/index.cgi
          grep -q 'LoxBerry::Web::lbfooter' webfrontend/htmlauth/index.cgi
          test -f webfrontend/htmlauth/discover.cgi
          test -f webfrontend/htmlauth/security.cgi
          grep -q 'allow_reboot' config/config.default.json
          grep -q 'allowed_actions' bin/mqtt_listener.py
          grep -q "frame-ancestors 'self'" webfrontend/htmlauth/security.cgi
          grep -q 'X-Frame-Options: SAMEORIGIN' webfrontend/htmlauth/debug.cgi
          grep -q "REQUEST_METHOD.*POST" webfrontend/htmlauth/discover.cgi
      - name: Python compatibility
        run: |
          if grep -RIn --include='*.cgi' --include='*.py' -E '(^|[,[:space:]])import[[:space:]]+cgi([,[:space:]]|$)|from[[:space:]]+cgi[[:space:]]+import' webfrontend bin; then
            echo 'Deprecated Python cgi module found'
            exit 1
          fi
      - name: LoxBerry path compliance
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=.github '/opt/loxberry' .; then
            echo 'Hardcoded /opt/loxberry path found'
            exit 1
          fi
      - name: Icon set
        run: |
          test -s icons/icon.svg
          test -s icons/icon_64.png
          test -s icons/icon_128.png
          test -s icons/icon_256.png
          test -s icons/icon_512.png
